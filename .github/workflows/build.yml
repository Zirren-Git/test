  prodboot:
    name: Production jar boot test (real launcher, MC 26.2 / loader 0.19.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MC: "26.2"
      DEP: "~26.2"
      API: "0.161.0+26.2"
      MODMENU: "20.0.2"
      LOADER: "0.19.3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEODRIVER: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the shipped jar
        run: ./gradlew build -Pminecraft_version=$MC -Pminecraft_dep=$DEP -Pfabric_api_version=$API -Pmodmenu_version=$MODMENU -Ploader_version=$LOADER

      - name: Install virtual display + software GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers jq

      - name: Create a real Fabric instance (like a launcher does)
        run: |
          curl -sfL -o fabric-installer.jar "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.1/fabric-installer-1.1.1.jar"
          mkdir -p instance   # installer requires an existing game dir
          java -jar fabric-installer.jar client -dir instance -mcversion "$MC" -loader "$LOADER" -noprofile
          echo "--- instance layout ---"
          find instance -maxdepth 3 -type d | sort
          echo "--- launcher dir ---"
          ls -la instance/.fabric/launcher/ || true

      - name: Install mods (shipped jar + Fabric API + Mod Menu)
        run: |
          mkdir -p instance/mods
          cp build/libs/chatterbox-*+mc26.2.jar instance/mods/
          curl -sfL -o "instance/mods/fabric-api-0.161.0+26.2.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.2/fabric-api-0.161.0+26.2.jar"
          curl -sfL -o "instance/mods/modmenu-20.0.2.jar" "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/20.0.2/modmenu-20.0.2.jar"
          ls -la instance/mods/

      - name: Boot the production instance (baseline - must pass)
        run: |
          set +e
          if [ -f instance/.fabric/launcher/launch.sh ]; then
            { echo "cd \"$(pwd)/instance\""; cat instance/.fabric/launcher/launch.sh; } > run-instance.sh
          elif [ -f instance/.fabric/launcher/launch.bat ]; then
            sed -e 's/\\/\//g' -e 's/;/:/g' instance/.fabric/launcher/launch.bat \
              | grep -iE '^ *(java|javaw) ' | sed -e 's/^ *javaw */java /' > run-body.sh
            { echo "cd \"$(pwd)/instance\""; cat run-body.sh; } > run-instance.sh
          else
            find instance/.fabric -type f | head -40
            echo "::error::no launcher script generated by fabric-installer"
            exit 1
          fi
          echo "--- launch script (first lines) ---"
          head -c 600 run-instance.sh; echo
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" timeout -k 30 240 bash run-instance.sh > game-baseline.log 2>&1
          code=$?
          echo "game exit code: $code (124 = ran until timeout = good)"
          tail -n 30 game-baseline.log

      - name: Check baseline boot
        run: |
          LOG=instance/logs/latest.log
          REPORT=".apidump/prodboot.txt"
          mkdir -p .apidump
          {
            echo "=== production boot test MC $MC loader $LOADER (baseline) ==="
            echo "--- chatterbox markers ---"; grep -n "ChatterBox" "$LOG" || true
            echo "--- mixin/refmap messages ---"; grep -niE "mixin|refmap" "$LOG" | head -40 || true
            echo "--- errors ---"; grep -nE "ERROR|FATAL|Exception" "$LOG" | head -40 || true
            echo "--- boot markers ---"; grep -nE "Backend library|Sound engine|Setting user|OpenAL|Reloading ResourceManager" "$LOG" | head -10 || true
            echo "--- game output tail ---"; tail -n 80 game-baseline.log
            if ls instance/crash-reports/*.txt >/dev/null 2>&1; then
              echo "--- crash report ---"; head -n 200 instance/crash-reports/*.txt
            fi
          } > "$REPORT"
          ok=1
          grep -q "ChatterBox initialized" "$LOG" || { echo "::error::ChatterBox did not initialize in production mode"; ok=0; }
          grep -q "Sound engine started" "$LOG" || { echo "::error::game did not finish booting"; ok=0; }
          ls instance/crash-reports/*.txt >/dev/null 2>&1 && { echo "::error::crash report produced"; ok=0; }
          if [ $ok -ne 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "prodboot failure: baseline MC $MC loader $LOADER [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
            exit 1
          fi
          echo "PRODUCTION BOOT PASSED"

      - name: Boot with other chat mods (advisory - report only)
        run: |
          set +e
          for slug in chat_heads chatanimation; do
            url=$(curl -sf "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url // empty' 2>/dev/null)
            if [ -n "$url" ]; then
              curl -sfL -o "instance/mods/$slug.jar" "$url" && echo "added $slug"
            else
              echo "skipped $slug (no $MC fabric build on Modrinth)"
            fi
          done
          ls -la instance/mods/
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" timeout -k 30 240 bash run-instance.sh > game-chatmods.log 2>&1
          code=$?
          echo "game exit code: $code (124 = ran until timeout = good)"
          LOG=instance/logs/latest.log
          REPORT=".apidump/prodboot-chatmods.txt"
          {
            echo "=== production boot test with other chat mods ==="
            ls instance/mods/
            echo "--- chatterbox markers ---"; grep -n "ChatterBox" "$LOG" || true
            echo "--- errors ---"; grep -nE "ERROR|FATAL|Exception" "$LOG" | head -40 || true
            echo "--- game output tail ---"; tail -n 80 game-chatmods.log
            if ls instance/crash-reports/*.txt >/dev/null 2>&1; then
              echo "--- crash report ---"; head -n 200 instance/crash-reports/*.txt
            fi
          } > "$REPORT"
          if grep -q "ChatterBox initialized" "$LOG" && ! ls instance/crash-reports/*.txt >/dev/null 2>&1; then
            echo "CHAT-MODS BOOT PASSED (advisory)"
          else
            echo "::warning::chat-mods boot had problems - report committed for inspection"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "prodboot advisory: chat-mods run MC $MC [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
          fi

      - name: Upload production boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodboot-logs
          path: |
            game-*.log
            instance/logs/
            instance/crash-reports/
            .apidump/prodboot*.txt
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build, smoke262, smoke263, prodboot]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ls -la artifacts/ || true
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          # publish the loader 0.19.5 builds (which run on 0.19.3-0.19.5)
          FILES=$(ls artifacts/*mc26.2*loader0.19.5*.jar artifacts/*mc26.3*loader0.19.5*.jar 2>/dev/null || ls artifacts/*.jar)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "ChatterBox $TAG" \
              --notes "Built from branch ${GITHUB_REF#refs/heads/}. See README for features and install instructions."
          fi
