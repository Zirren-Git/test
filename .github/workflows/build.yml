  prodboot:
    name: Production jar boot test (real launcher, MC 26.2 / loader 0.19.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MC: "26.2"
      DEP: "~26.2"
      API: "0.161.0+26.2"
      MODMENU: "20.0.2"
      LOADER: "0.19.3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEODRIVER: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the shipped jar
        run: ./gradlew build -Pminecraft_version=$MC -Pminecraft_dep=$DEP -Pfabric_api_version=$API -Pmodmenu_version=$MODMENU -Ploader_version=$LOADER

      - name: Install virtual display + software GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers jq

      - name: Create a real Fabric instance (like a launcher does)
        run: |
          curl -sfL -o fabric-installer.jar "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.1/fabric-installer-1.1.1.jar"
          mkdir -p instance   # installer requires an existing game dir
          java -jar fabric-installer.jar client -dir instance -mcversion "$MC" -loader "$LOADER" -noprofile
          echo "--- instance layout ---"
          find instance -maxdepth 3 -type d | sort
          echo "--- launcher dir ---"
          ls -la instance/.fabric/launcher/ || true

      - name: Install mods (shipped jar + Fabric API + Mod Menu)
        run: |
          mkdir -p instance/mods
          cp build/libs/chatterbox-*+mc26.2.jar instance/mods/
          curl -sfL --retry 4 --retry-delay 5 --retry-all-errors -o "instance/mods/fabric-api-0.161.0+26.2.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.2/fabric-api-0.161.0+26.2.jar"
          # terraformers maven is flaky - retry, then fall back to Modrinth
          if ! curl -sfL --retry 4 --retry-delay 5 --retry-all-errors -o "instance/mods/modmenu-20.0.2.jar" "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/20.0.2/modmenu-20.0.2.jar"; then
            echo "terraformers maven failed - downloading modmenu $MODMENU from Modrinth"
            url=$(curl -sf "https://api.modrinth.com/v2/project/modmenu/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" \
              | jq -r "([.[] | select(.version_number==\"$MODMENU\")][0].files[0].url) // (.[0].files[0].url) // empty")
            [ -n "$url" ]
            curl -sfL --retry 4 --retry-delay 5 --retry-all-errors -o "instance/mods/modmenu-20.0.2.jar" "$url"
          fi
          ls -la instance/mods/

      - name: Download the vanilla client + libraries (like a launcher does)
        run: |
          set -e
          MANIFEST=$(curl -sfL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          VURL=$(echo "$MANIFEST" | jq -r '.versions[] | select(.id=="'"$MC"'") | .url' | head -1)
          echo "version json: $VURL"
          curl -sfL -o version.json "$VURL"
          mkdir -p "instance/versions/$MC"
          curl -sfL -o "instance/versions/$MC/$MC.jar" "$(jq -r '.downloads.client.url' version.json)"
          jq -r '.libraries[].downloads.artifact.path // empty' version.json | while read -r lib; do
            [ -z "$lib" ] && continue
            mkdir -p "instance/libraries-mc/$(dirname "$lib")"
            curl -sfL -o "instance/libraries-mc/$lib" "https://libraries.minecraft.net/$lib"
          done
          mkdir -p instance/natives
          jq -r '.libraries[].downloads.classifiers["natives-linux"].path // empty' version.json | while read -r lib; do
            [ -z "$lib" ] && continue
            curl -sfL -o /tmp/natives.zip "https://libraries.minecraft.net/$lib"
            unzip -oq /tmp/natives.zip -d instance/natives
          done
          echo "client jar and $(find instance/libraries-mc -name '*.jar' | wc -l) libraries downloaded"

      - name: Prepare game assets
        run: |
          set -e
          ./gradlew downloadAssets -Pminecraft_version=$MC -Pminecraft_dep=$DEP -Pfabric_api_version=$API -Pmodmenu_version=$MODMENU -Ploader_version=$LOADER > /dev/null 2>&1 || true
          ASSETS=$(find "$HOME/.gradle/caches/fabric-loom" -type d -name assets 2>/dev/null | head -1)
          if [ -z "$ASSETS" ]; then
            echo "loom assets cache not found - downloading directly"
            ASSETS="$PWD/instance/assets"
            AID=$(jq -r '.assetIndex.id' version.json)
            mkdir -p "$ASSETS/indexes" "$ASSETS/objects"
            curl -sfL -o "$ASSETS/indexes/$AID.json" "$(jq -r '.assetIndex.url' version.json)"
            jq -r '.objects | to_entries[] | [.value.hash] | @tsv' "$ASSETS/indexes/$AID.json" \
              | while read -r hash; do
                  echo "https://resources.download.minecraft.net/${hash:0:2}/$hash $ASSETS/objects/${hash:0:2}/$hash"
                done | xargs -P 16 -n 2 sh -c 'curl -sfL -o "$1" "$0"'
          fi
          echo "ASSETS_DIR=$ASSETS" >> "$GITHUB_ENV"
          echo "ASSET_INDEX=$(jq -r '.assetIndex.id' version.json)" >> "$GITHUB_ENV"
          echo "assets at: $ASSETS"

      - name: Boot the production instance (baseline - must pass)
        run: |
          set -e
          CP=$(find "$PWD/instance/libraries" "$PWD/instance/libraries-mc" -name '*.jar' | tr '\n' ':')"$PWD/instance/versions/$MC/$MC.jar"
          echo "classpath jars: $(find instance/libraries instance/libraries-mc -name '*.jar' | wc -l)"
          cat > run-game.sh <<EOF
          #!/usr/bin/env bash
          cd "$PWD/instance"
          exec java -Xmx2G \
            -Djava.library.path="$PWD/instance/natives" \
            -cp "$CP" \
            net.fabricmc.loader.impl.launch.knot.KnotClient \
            --username Player --version "$MC" --gameDir . \
            --assetsDir "$ASSETS_DIR" --assetIndex "$ASSET_INDEX" \
            --accessToken 0 --userType legacy --clientId 0 --xuid 0
          EOF
          cat run-game.sh
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" timeout -k 30 240 bash run-game.sh > game-baseline.log 2>&1
          code=$?
          echo "$code" > game-exitcode.txt
          echo "game exit code: $code (124 = ran until timeout = good)"
          tail -n 30 game-baseline.log

      - name: Check baseline boot
        run: |
          LOG=instance/logs/latest.log
          REPORT=".apidump/prodboot.txt"
          mkdir -p .apidump
          {
            echo "=== production boot test MC $MC loader $LOADER (baseline) ==="
            echo "--- chatterbox markers ---"; grep -n "ChatterBox" "$LOG" || true
            echo "--- mixin/refmap messages ---"; grep -niE "mixin|refmap" "$LOG" | head -40 || true
            echo "--- errors ---"; grep -nE "ERROR|FATAL|Exception" "$LOG" | head -40 || true
            echo "--- boot markers ---"; grep -nE "Backend library|Sound engine|Setting user|OpenAL|Reloading ResourceManager" "$LOG" | head -10 || true
            echo "--- game output tail ---"; tail -n 80 game-baseline.log
            if ls instance/crash-reports/*.txt >/dev/null 2>&1; then
              echo "--- crash report ---"; head -n 200 instance/crash-reports/*.txt
            fi
          } > "$REPORT"
          ok=1
          grep -q "ChatterBox initialized" "$LOG" || { echo "::error::ChatterBox did not initialize in production mode"; ok=0; }
          grep -q "Reloading ResourceManager: vanilla, chatterbox" "$LOG" || { echo "::error::game did not get past mod loading"; ok=0; }
          ls instance/crash-reports/*.txt >/dev/null 2>&1 && { echo "::error::crash report produced"; ok=0; }
          code=$(cat game-exitcode.txt 2>/dev/null || echo unknown)
          [ "$code" = "124" ] || { echo "::error::game exited early (code $code) instead of surviving until the timeout"; ok=0; }
          if [ $ok -ne 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "prodboot failure: baseline MC $MC loader $LOADER [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
            exit 1
          fi
          echo "PRODUCTION BOOT PASSED"

      - name: Boot with other chat mods (advisory - report only)
        run: |
          set +e
          # Fabric Language Kotlin pinned to the newest 1.13.x: 1.14+ requires
          # loader >=0.19.5, but this test mirrors a loader 0.19.3 instance
          flk=$(curl -sf "https://api.modrinth.com/v2/project/fabric-language-kotlin/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" \
            | jq -r '[.[] | select(.version_number | startswith("1.13."))][0].files[0].url // empty')
          if [ -n "$flk" ]; then
            curl -sfL -o "instance/mods/fabric-language-kotlin.jar" "$flk" && echo "added fabric-language-kotlin (1.13.x)"
          fi
          for slug in appleskin betterf3 chat-heads chatanimation raised immediatelyfast entityculling modernfix jade xaeros-minimap xaeros-world-map sodium iris continuity falling-leaves mouse-tweaks gamma-utils ferrite-core lithium krypton reeses-sodium-options cloth-config yetanotherconfiglib betterstats searchables controlling highlighter pick-up-notifier immersive-hotbar make-bubbles-pop screenshot-viewer status-effect-bars subtle-effects camera-overhaul centered-crosshair geckolib spark c2me-fabric vmp-fabric packet-fixer scalablelux async-particles yacl forge-config-api-port puzzles-lib fzzy-config; do
            url=$(curl -sf "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url // empty' 2>/dev/null)
            if [ -n "$url" ]; then
              curl -sfL -o "instance/mods/$slug.jar" "$url" && echo "added $slug"
            else
              echo "skipped $slug (no $MC fabric build on Modrinth)"
            fi
          done
          ls -la instance/mods/
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" timeout -k 30 420 bash run-game.sh > game-chatmods.log 2>&1
          code=$?
          echo "game exit code: $code (124 = ran until timeout = good)"
          LOG=instance/logs/latest.log
          REPORT=".apidump/prodboot-chatmods.txt"
          {
            echo "=== production boot test with other chat mods ==="
            ls instance/mods/
            echo "--- chatterbox markers ---"; grep -n "ChatterBox" "$LOG" || true
            echo "--- errors ---"; grep -nE "ERROR|FATAL|Exception" "$LOG" | head -40 || true
            echo "--- game output tail ---"; tail -n 80 game-chatmods.log
            if ls instance/crash-reports/*.txt >/dev/null 2>&1; then
              echo "--- crash report ---"; head -n 200 instance/crash-reports/*.txt
            fi
          } > "$REPORT"
          if grep -q "ChatterBox initialized" "$LOG" && ! ls instance/crash-reports/*.txt >/dev/null 2>&1; then
            echo "CHAT-MODS BOOT PASSED (advisory)"
          else
            echo "::warning::chat-mods boot had problems - report committed for inspection"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "prodboot advisory: chat-mods run MC $MC [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
          fi

      - name: Upload production boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodboot-logs
          path: |
            game-*.log
            instance/logs/
            instance/crash-reports/
            .apidump/prodboot*.txt
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build, smoke262, smoke263, prodboot]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ls -la artifacts/ || true
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          # publish the loader 0.19.5 builds (which run on 0.19.3-0.19.5)
          JARS=$(ls artifacts/*mc26.2*loader0.19.5*.jar artifacts/*mc26.3*loader0.19.5*.jar 2>/dev/null || ls artifacts/*.jar)
          # checksum sidecars so users can verify their download is not truncated
          for f in $JARS; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done
          # release notes with the checksum table visible on the release page
          NOTES=$(mktemp --suffix=.md)
          {
            echo "ChatterBox $TAG - chat folders, DMs, mention sounds + Tune Maker, search, logs, pins, compression, drafts, queue, timestamps, ModMenu config. For Minecraft 26.2 & 26.3, Fabric Loader 0.19.3-0.19.5, Java 25."
            echo ""
            echo "## Download integrity"
            echo ""
            echo "If the game crashes with \`zip END header not found\` mentioning chatterbox, your jar download was truncated/corrupted - the mod never ran. Delete every chatterbox jar from your mods folder (including any \" (1)\" copies Windows made), re-download, and verify the size and SHA-256 against this table (PowerShell: \`Get-FileHash <file> -Algorithm SHA256\`):"
            echo ""
            echo "| file | size (bytes) | sha256 |"
            echo "|---|---|---|"
            for f in $JARS; do echo "| \`$(basename "$f")\` | $(stat -c%s "$f") | \`$(cat "$f.sha256")\` |"; done
          } > "$NOTES"
          cat "$NOTES"
          FILES="$JARS $(for f in $JARS; do echo "$f.sha256"; done)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "ChatterBox $TAG" \
              --notes-file "$NOTES"
          fi

  verify-release:
    name: Verify release download integrity
    needs: release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads the published jars with an authenticated request (this repo
      # is private - anonymous release URLs return 404) and validates them
      # end to end: full ZIP structure check (unzip -t) + sha256 vs sidecar.
      - name: Download the published release and validate it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          echo "verifying release $TAG"

          verify() {
            cd "$GITHUB_WORKSPACE"
            rm -rf dl && mkdir dl
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --pattern '*.jar.sha256' --dir dl --clobber
            ls -la dl
            cd dl
            for j in *.jar; do
              echo "=== $j ==="
              unzip -t "$j" > /dev/null && echo "ZIP OK: $j" || { echo "::warning::$j is not a valid zip on this attempt"; return 1; }
              expected=$(cat "$j.sha256" | tr -d '[:space:]')
              actual=$(sha256sum "$j" | awk '{print $1}')
              if [ "$expected" != "$actual" ]; then
                echo "::warning::sha256 mismatch for $j: expected $expected, got $actual"
                return 1
              fi
              echo "SHA256 OK: $j $actual"
            done
          }

          # This job starts seconds after the release is published; the CDN can
          # briefly serve a truncated copy of a brand-new asset (the same
          # read-your-writes race users hit downloading right after a release),
          # so retry the whole download+validation before declaring failure.
          n=0
          until verify; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::release assets failed validation after $((n+1)) attempts"
              exit 1
            fi
            echo "download/validation failed - retrying in 30s (attempt $((n+2)) of 4)..."
            sleep 30
          done
          echo "RELEASE ASSETS VERIFIED - the published jars are intact"
