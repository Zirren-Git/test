  build:
    name: Build MC ${{ matrix.mc }} / loader ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minecraft 26.2
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.3" }
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.4" }
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.5" }
          # Minecraft 26.3
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.3" }
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.4" }
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.5" }
    env:
      MC: ${{ matrix.mc }}
      API: ${{ matrix.api }}
      DEP: ${{ matrix.dep }}
      MODMENU: ${{ matrix.modmenu }}
      LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          if ! ./gradlew build --stacktrace \
              -Pminecraft_version=$MC \
              -Pminecraft_dep=$DEP \
              -Pfabric_api_version=$API \
              -Pmodmenu_version=$MODMENU \
              -Ploader_version=$LOADER > build.log 2>&1; then
            echo "BUILD FAILED - capturing errors"
            mkdir -p .apidump
            { echo "=== build errors: MC $MC loader $LOADER ==="; grep -E "error:|warning: \[|\.java:[0-9]+:[0-9]+" build.log | head -200; echo "=== tail ==="; tail -n 120 build.log; } > ".apidump/build-errors.txt"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .apidump/build-errors.txt || true
            git commit -m "build errors: MC $MC loader $LOADER [skip ci]" || true
            git push || true
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          ls build/libs
          cp build/libs/*.jar dist/
          ls dist

      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-mc${{ matrix.mc }}-loader${{ matrix.loader }}
          path: dist/*.jar

  release:
    name: GitHub Release
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ls -la artifacts/ || true
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          # publish the loader 0.19.5 builds (which run on 0.19.3-0.19.5)
          FILES=$(ls artifacts/*mc26.2*loader0.19.5*.jar artifacts/*mc26.3*loader0.19.5*.jar 2>/dev/null || ls artifacts/*.jar)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "ChatterBox $TAG" \
              --notes "Built from branch ${GITHUB_REF#refs/heads/}. See README for features and install instructions."
          fi
