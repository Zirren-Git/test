          else
            git commit -m "apidump: MC 26.2 [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${GITHUB_REF_NAME} && git push && break
              echo "retry $i"; sleep 10
            done
          fi

  build:
    name: Build MC ${{ matrix.mc }} / loader ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minecraft 26.2
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.3" }
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.4" }
          - { mc: "26.2", api: "0.161.0+26.2", dep: "~26.2", modmenu: "20.0.2", loader: "0.19.5" }
          # Minecraft 26.3
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.3" }
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.4" }
          - { mc: "26.3", api: "0.161.0+26.3", dep: "~26.3", modmenu: "21.0.0-beta.1", loader: "0.19.5" }
    env:
      MC: ${{ matrix.mc }}
      API: ${{ matrix.api }}
      DEP: ${{ matrix.dep }}
      MODMENU: ${{ matrix.modmenu }}
      LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          if ! ./gradlew build --stacktrace \
              -Pminecraft_version=$MC \
              -Pminecraft_dep=$DEP \
              -Pfabric_api_version=$API \
              -Pmodmenu_version=$MODMENU \
              -Ploader_version=$LOADER > build.log 2>&1; then
            echo "BUILD FAILED - capturing errors"
            mkdir -p .apidump
            { echo "=== build errors: MC $MC loader $LOADER ==="; grep -E "error:|warning: \[|\.java:[0-9]+:[0-9]+" build.log | head -200; echo "=== tail ==="; tail -n 120 build.log; } > ".apidump/build-errors.txt"
          cat ".apidump/build-errors.txt"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .apidump/build-errors.txt || true
            git commit -m "build errors: MC $MC loader $LOADER [skip ci]" || true
            git push || true
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mc${{ matrix.mc }}-loader${{ matrix.loader }}
          path: build.log
          if-no-files-found: ignore

      - name: Collect artifacts
        run: |
          mkdir -p dist
          ls build/libs
          cp build/libs/*.jar dist/
          ls dist

      - name: Decompile list widget internals (diagnose invisible lists)
        if: matrix.mc == '26.2' && matrix.loader == '0.19.3'
        run: |
          set -e
          mkdir -p .apidump/decomp
          # locate the mapped minecraft jar in the loom cache
          MCJAR=""
          for j in $(find "$HOME/.gradle/caches/fabric-loom" -name "*.jar" ! -name "*sources*" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "components/AbstractSelectionList.class"; then MCJAR="$j"; break; fi
          done
          echo "minecraft jar: $MCJAR"
          if [ -n "$MCJAR" ]; then
            javap -c -p -classpath "$MCJAR" \
              'net.minecraft.client.gui.components.AbstractSelectionList' \
              'net.minecraft.client.gui.components.AbstractSelectionList$Entry' \
              > .apidump/decomp/mc-AbstractSelectionList.txt
            javap -c -p -classpath "$MCJAR" \
              'net.minecraft.client.gui.components.AbstractWidget' \
              'net.minecraft.client.gui.components.AbstractContainerWidget' \
              > .apidump/decomp/mc-AbstractWidget.txt
          fi
          # compare with a known-working 26.2 mod that uses selection lists
          if curl -sfL -o /tmp/modmenu.jar "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/20.0.2/modmenu-20.0.2.jar"; then
            javap -c -p -classpath /tmp/modmenu.jar \
              'com.terraformersmc.modmenu.gui.widget.DescriptionListWidget' \
              'com.terraformersmc.modmenu.gui.widget.DescriptionListWidget$MailableContactEntry' \
              'com.terraformersmc.modmenu.gui.ModsScreen' \
              > .apidump/decomp/modmenu-lists.txt 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .apidump/decomp/*.txt
          git commit -m "decomp: selection list internals MC $MC [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done

      - name: Inspect remapped jar (mixin target names)
        run: |
          JAR=$(ls build/libs/*.jar 2>/dev/null | grep -v sources | head -1 || true)
          if [ -z "$JAR" ]; then echo "no jar built"; exit 0; fi
          mkdir -p inspect && cd inspect
          unzip -o "../$JAR" 'io/github/zirren/chatterbox/mixin/*.class' 'io/github/zirren/chatterbox/chat/ChatDisplay.class' > /dev/null
          echo "=== ChatterBox mixin constant-pool strings ==="
          for c in io/github/zirren/chatterbox/mixin/*.class; do
            echo "--- $c"
            strings -a "$c" | grep -aE "net/minecraft|class_[0-9]+|method_[0-9]+|field_[0-9]+|openChatScreen|addMessage|logChatMessage|allMessages|chatScrollbarPos|commandSuggestions" | sort -u | head -30
          done
          echo "--- ChatDisplay (regular class references)"
          strings -a io/github/zirren/chatterbox/chat/ChatDisplay.class | grep -aE "net/minecraft|class_[0-9]+" | sort -u | head -20
          echo "=== ModMenu 20.0.2 (known-working 26.2 mod) for comparison ==="
          if curl -sfL -o modmenu.jar "https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/20.0.2/modmenu-20.0.2.jar"; then
            unzip -o modmenu.jar '*.class' -d modmenu > /dev/null 2>&1 || true
            find modmenu -iname '*mixin*.class' | head -2 | while read -r c; do
              echo "--- $c"
              strings -a "$c" | grep -aE "net/minecraft|class_[0-9]+|method_[0-9]+" | sort -u | head -15
            done
            echo "--- any modmenu class refs (shape check)"
            find modmenu -name '*.class' | head -3 | while read -r c; do
              echo "--- $c"
              strings -a "$c" | grep -aE "net/minecraft|class_[0-9]+" | sort -u | head -10
            done
          else
            echo "(modmenu download failed)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chatterbox-mc${{ matrix.mc }}-loader${{ matrix.loader }}
          path: dist/*.jar

  smoke262:
    name: Smoke test MC 26.2 / loader 0.19.3 (launches the game)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MC: "26.2"
      API: "0.161.0+26.2"
      DEP: "~26.2"
      MODMENU: "20.0.2"
      LOADER: "0.19.3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEODRIVER: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display + software GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Launch game with the mod (selftest quits it)
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" timeout -k 30 600 ./gradlew runClient             -Pminecraft_version=$MC -Pminecraft_dep=$DEP             -Pfabric_api_version=$API -Pmodmenu_version=$MODMENU             -Ploader_version=$LOADER > smoke-gradle.log 2>&1
          code=$?
          echo "gradle exit code: $code"
          exit 0

      - name: Check selftest results
        run: |
          LOG=run/logs/latest.log
          REPORT=".apidump/smoke-mc$MC-loader$LOADER.txt"
          mkdir -p .apidump
          if [ ! -f "$LOG" ]; then
            { echo "=== smoke test MC $MC loader $LOADER: game never produced a log ==="; tail -n 100 smoke-gradle.log; } > "$REPORT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "smoke failure: no game log, MC $MC loader $LOADER [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
            echo "::error::game never produced a log"
            exit 1
          fi
          {
            echo "=== smoke test MC $MC loader $LOADER ==="
            echo "--- selftest lines ---"; grep -n "CHATTERBOX SELFTEST" "$LOG" || true
            echo "--- error markers ---"; grep -nE "Crash report|MixinApplyError|Exception|FATAL" "$LOG" | head -60 || true
            echo "--- game log tail ---"; tail -n 120 "$LOG"
            echo "--- gradle log tail ---"; tail -n 60 smoke-gradle.log
            if [ -n "$(ls run/crash-reports/*.txt 2>/dev/null)" ]; then
              echo "--- crash report ---"; head -n 150 run/crash-reports/*.txt
            fi
          } > "$REPORT"
          if grep -q "CHATTERBOX SELFTEST COMPLETE: FAILURES=0" "$LOG" && [ -z "$(ls run/crash-reports/*.txt 2>/dev/null)" ]; then
            echo "SMOKE TEST PASSED"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$REPORT"
            git commit -m "smoke failure: MC $MC loader $LOADER [skip ci]" || true
            for i in 1 2 3 4 5; do git pull --rebase origin ${GITHUB_REF_NAME} && git push && break; sleep 10; done
            echo "::error::selftest did not complete cleanly (log committed to $REPORT)"
            exit 1
          fi

      - name: Upload game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-mc26.2-loader0.19.3
          path: |
            run/logs/
            run/crash-reports/
            smoke-gradle.log
          if-no-files-found: warn

