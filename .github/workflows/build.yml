name: Build

on:
  push:
    branches: [main, arena/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apidump263:
    name: API dump sources (MC 26.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: apidump263
      cancel-in-progress: false
    env:
      MC: "26.3"
      API: "0.161.0+26.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: |
          ./gradlew -q dependencies -Pminecraft_version=$MC -Pfabric_api_version=$API > deps.log 2>&1 || true
          tail -n 30 deps.log || true

      - name: Generate sources
        run: |
          ./gradlew -q genSources -Pminecraft_version=$MC -Pfabric_api_version=$API > gensources.log 2>&1 || true
          tail -n 30 gensources.log || true

      - name: Locate jars
        run: |
          set -x
          JAR=""
          SRCS=""
          for j in $(find "$HOME/.gradle/caches" -name "*.jar" 2>/dev/null); do
            case "$j" in *sources*) continue;; esac
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/components/ChatComponent.class"; then JAR="$j"; fi
          done
          {
            echo "loom cache dirs:"
            find "$HOME/.gradle" -maxdepth 5 -type d -iname "*loom*" 2>/dev/null | head -20
            echo "gensources log tail:"
            tail -n 40 gensources.log 2>/dev/null || true
            echo "all source-ish jars:"
            find "$HOME/.gradle" "$PWD/.gradle" "$HOME/.cache" -name "*.jar" 2>/dev/null | grep -iE "sources|decompil" | head -40
          } > .apidump/diagnostics.txt 2>&1
          for j in $(find "$HOME" "$PWD" -name "*sources*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/components/ChatComponent.java"; then SRCS="$j"; fi
          done
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "SRCS=$SRCS" >> "$GITHUB_ENV"
          echo "JAR=$JAR"
          echo "SRCS=$SRCS"

      - name: Dump
        env:
          OUT: .apidump/mc26.3
        run: |
          mkdir -p "$OUT"

          {
            echo "===== classes matching Chat ====="
            unzip -l "$JAR" | grep -iE "chat" | awk '{print $4}' | grep "\.class" | grep -v '\$' | sort | head -80
            echo "===== screens ====="
            unzip -l "$JAR" | grep -E "net/minecraft/client/gui/screens/.*Screen.class" | awk '{print $4}' | grep -v '\$' | head -60
            echo "===== input ====="
            unzip -l "$JAR" | grep -E "net/minecraft/client/input/.*\.class" | awk '{print $4}' | grep -v '\$' | head -40
          } > "$OUT/classes.txt" 2>&1

          for c in \
            net.minecraft.client.Minecraft \
            net.minecraft.client.gui.Gui \
            net.minecraft.client.gui.Hud \
            net.minecraft.client.gui.screens.ChatScreen \
            net.minecraft.client.gui.components.ChatComponent \
            net.minecraft.client.multiplayer.chat.GuiMessage \
            'net.minecraft.client.multiplayer.chat.GuiMessage$Line' \
            net.minecraft.client.multiplayer.chat.GuiMessageTag \
            net.minecraft.client.multiplayer.chat.GuiMessageSource \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.gui.components.AbstractWidget \
            net.minecraft.client.gui.components.Button \
            net.minecraft.client.gui.components.EditBox \
            net.minecraft.client.gui.components.Checkbox \
            net.minecraft.client.gui.components.AbstractSliderButton \
            net.minecraft.client.gui.components.AbstractSelectionList \
            net.minecraft.client.gui.components.ObjectSelectionList \
            net.minecraft.client.gui.components.OptionsList \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.client.gui.Font \
            net.minecraft.client.StringSplitter \
            net.minecraft.client.KeyMapping \
            net.minecraft.client.input.KeyEvent \
            net.minecraft.client.input.MouseButtonEvent \
            net.minecraft.client.multiplayer.ClientPacketListener \
            net.minecraft.client.multiplayer.PlayerInfo \
            net.minecraft.client.multiplayer.chat.ChatListener \
            net.minecraft.client.player.LocalPlayer \
            net.minecraft.client.resources.sounds.SimpleSoundInstance \
            net.minecraft.client.resources.sounds.SoundInstance \
            net.minecraft.client.sounds.SoundManager \
            net.minecraft.resources.Identifier \
            net.minecraft.core.registries.BuiltInRegistries \
            net.minecraft.core.Registry \
            net.minecraft.network.chat.Component \
            net.minecraft.network.chat.Style \
            net.minecraft.network.chat.TextColor \
            net.minecraft.network.chat.MutableComponent \
            net.minecraft.network.chat.FormattedText \
            net.minecraft.ChatFormatting \
            net.minecraft.world.level.biome.Biome \
            net.minecraft.client.gui.Gui \
            net.minecraft.client.multiplayer.chat.GuiMessage \
            'net.minecraft.client.multiplayer.chat.GuiMessage$Line' \
            net.minecraft.client.multiplayer.chat.GuiMessageTag \
            net.minecraft.client.multiplayer.chat.GuiMessageSource \
            'net.minecraft.client.gui.components.ChatComponent$DisplayMode' \
            net.minecraft.client.gui.ActiveTextCollector \
            com.mojang.blaze3d.platform.InputConstants \
            'com.mojang.blaze3d.platform.InputConstants$Key' \
            'com.mojang.blaze3d.platform.InputConstants$Type' \
            net.minecraft.client.gui.components.ContainerObjectSelectionList \
            net.minecraft.client.gui.components.Tooltip \
            net.minecraft.client.input.CharacterEvent \
            net.minecraft.client.User \
            net.minecraft.client.multiplayer.ServerData \
            net.minecraft.client.multiplayer.PlayerInfo \
            net.minecraft.client.CommandHistory \
            'net.minecraft.client.gui.screens.ChatScreen$ExitReason' \
            'net.minecraft.client.gui.components.Checkbox$Builder' \
            'net.minecraft.client.gui.components.Button$Builder' \
            'net.minecraft.client.gui.components.Button$OnPress' \
            net.minecraft.client.gui.components.CycleButton \
            'net.minecraft.client.gui.components.CycleButton$Builder' \
            net.minecraft.client.gui.layouts.HeaderAndFooterLayout \
            net.minecraft.client.gui.components.AbstractButton \
            net.minecraft.client.gui.components.CommandSuggestions \
            'net.minecraft.client.KeyMapping$Category' \
            ; do
            n=$(echo "$c" | tr '$' '_' | tr '.' '_')
            javap -p -cp "$JAR" "$c" > "$OUT/javap-$n.txt" 2>&1 || true
          done

          # bytecode disassembly of the critical classes (flow reconstruction)
          for c in \
            net.minecraft.client.gui.components.ChatComponent \
            net.minecraft.client.gui.screens.ChatScreen \
            net.minecraft.client.gui.Gui \
            net.minecraft.client.multiplayer.chat.GuiMessage \
            'net.minecraft.client.multiplayer.chat.GuiMessage$Line' \
            net.minecraft.client.input.KeyEvent \
            net.minecraft.client.gui.components.EditBox \
            net.minecraft.client.CommandHistory \
            net.minecraft.client.KeyMapping \
            ; do
            n=$(echo "$c" | tr '$' '_' | tr '.' '_')
            javap -c -p -cp "$JAR" "$c" > "$OUT/bytecode-$n.txt" 2>&1 || true
          done

          for f in \
            net/minecraft/client/gui/components/ChatComponent.java \
            net/minecraft/client/gui/components/GuiMessage.java \
            net/minecraft/client/gui/components/GuiMessageTag.java \
            net/minecraft/client/gui/screens/ChatScreen.java \
            net/minecraft/client/input/KeyEvent.java \
            net/minecraft/client/input/MouseButtonEvent.java \
            net/minecraft/client/KeyMapping.java \
            net/minecraft/client/resources/sounds/SimpleSoundInstance.java \
            net/minecraft/client/gui/components/Checkbox.java \
            net/minecraft/client/gui/components/AbstractSliderButton.java \
            net/minecraft/client/gui/components/EditBox.java \
            net/minecraft/client/multiplayer/chat/ChatListener.java \
            ; do
            n=$(basename "$f" .java | tr '$' '_')
            unzip -p "$SRCS" "$f" > "$OUT/src-$n.java" 2>/dev/null || echo "(not found)" > "$OUT/src-$n.java"
          done

          for f in \
            net/minecraft/client/gui/GuiGraphicsExtractor.java \
            net/minecraft/client/gui/screens/Screen.java \
            net/minecraft/client/gui/components/AbstractWidget.java \
            net/minecraft/client/gui/components/Button.java \
            net/minecraft/client/gui/components/AbstractSelectionList.java \
            net/minecraft/client/gui/components/ObjectSelectionList.java \
            net/minecraft/client/Gui.java \
            net/minecraft/client/gui/Hud.java \
            net/minecraft/client/gui/Font.java \
            net/minecraft/client/StringSplitter.java \
            ; do
            n=$(basename "$f" .java | tr '$' '_')
            unzip -p "$SRCS" "$f" 2>/dev/null | grep -E "^\s*(public|protected|private).*\(" > "$OUT/sigs-$n.txt" || echo "(not found)" > "$OUT/sigs-$n.txt"
          done

          ls -la "$OUT"

      - name: Commit dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .apidump || true
          if git diff --cached --quiet; then
            echo "no dump changes"
          else
            git commit -m "apidump: MC 26.3 [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${GITHUB_REF_NAME} && git push && break
              echo "retry $i"; sleep 10
            done
          fi

  apidump262:
    name: API dump signatures (MC 26.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apidump263
    if: always()
    concurrency:
      group: apidump262
      cancel-in-progress: false
    env:
      MC: "26.2"
      API: "0.161.0+26.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: |
          ./gradlew -q dependencies -Pminecraft_version=$MC -Pfabric_api_version=$API > deps.log 2>&1 || true
          tail -n 30 deps.log || true

      - name: Locate jar
        run: |
          set -x
          JAR=""
          for j in $(find "$HOME/.gradle/caches" -name "*.jar" 2>/dev/null); do
            case "$j" in *sources*) continue;; esac
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/components/ChatComponent.class"; then JAR="$j"; fi
          done
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "JAR=$JAR"

      - name: Dump
